<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestingView Backoffice</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Bootstrap CSS (you can replace with your preferred UI framework) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">TestingView Backoffice</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-sessions">Sessions</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-journal">Journal</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="nav-analytics">Analytics</a>
                        </li>
                    </ul>
                    <div class="d-flex" id="auth-container">
                        <button class="btn btn-outline-light me-2" id="login-btn">Login</button>
                        <button class="btn btn-primary" id="register-btn">Register</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        <div id="app-container">
            <!-- Content will be loaded here based on navigation -->
            <div id="welcome-view" class="text-center py-5">
                <h1>Welcome to TestingView Backoffice</h1>
                <p class="lead">Please log in to access your sessions, journal, and analytics.</p>
            </div>
        </div>
    </main>

    <!-- Auth Components -->
    <div class="modal fade" id="login-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Login form will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="register-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Registration form will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">© 2025 TestingView Backoffice</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
